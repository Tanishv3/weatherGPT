<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WeatherGPT</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #151a24;
    --panel-2: #1b2130;
    --border: #262d3d;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --accent-soft: #24314f;
    --warn: #ea580c;
    --warn-soft: #3a1f10;
    --scroll-thumb: #30384d;
    --scroll-thumb-hover: #4f8cff;
  }
  * { box-sizing: border-box; }

  /* --- UI-matched scrollbars --- */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) transparent;
  }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 999px;
    border: 1px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover {
    background: var(--scroll-thumb-hover);
    background-clip: padding-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }

  /* --- Top bar --- */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .icon-btn:hover { background: var(--panel-2); }
  .place {
    display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted);
    white-space: nowrap;
  }
  .place strong { color: var(--text); font-weight: 600; }
  .search-wrap { flex: 1; min-width: 180px; }
  .search-wrap form { display: flex; }
  .search-wrap input {
    width: 100%; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.9rem;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  .topbar-right { display: flex; gap: 8px; margin-left: auto; align-items: center; }

  /* --- Duolingo-style language picker (UI only) --- */
  .language-picker { position: relative; flex: none; }
  #language-select {
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  .language-trigger {
    min-width: 148px; height: 38px; padding: 0 12px 0 13px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel); color: var(--text); cursor: pointer;
    font: inherit; font-size: 0.82rem;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .language-trigger:hover, .language-picker.open .language-trigger {
    background: var(--panel-2); border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .language-trigger .lang-trigger-left {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .language-globe { font-size: 1rem; line-height: 1; }
  #language-current { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .language-chevron { font-size: .72rem; color: var(--muted); transition: transform .15s ease; }
  .language-picker.open .language-chevron { transform: rotate(180deg); }
  .language-picker.loading .language-trigger { opacity: .7; cursor: wait; }
  .language-picker.loading .language-globe {
    display: inline-block; animation: lang-spin .8s linear infinite;
  }
  @keyframes lang-spin { to { transform: rotate(360deg); } }

  .language-menu {
    position: absolute; z-index: 100; top: calc(100% + 10px); right: 0;
    width: min(430px, calc(100vw - 28px)); max-height: 430px; overflow-y: auto;
    padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.38);
    opacity: 0; visibility: hidden; transform: translateY(-5px) scale(.985);
    transform-origin: top right; transition: opacity .14s ease, transform .14s ease, visibility .14s;
  }
  .language-picker.open .language-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .language-menu::-webkit-scrollbar { width: 8px; }
  .language-menu::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
  .language-menu::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 999px; border: 2px solid var(--panel);
    background-clip: padding-box;
  }
  .language-menu::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  .language-menu { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  .language-option {
    min-height: 42px; padding: 8px 10px; border: 0; border-radius: 10px;
    display: flex; align-items: center; gap: 9px; text-align: left;
    background: transparent; color: var(--text); cursor: pointer; font: inherit; font-size: .82rem;
  }
  .language-option:hover { background: var(--panel-2); }
  .language-option.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .language-option .lang-icon {
    width: 24px; height: 18px; flex: none; display: grid; place-items: center;
    font-size: 16px; line-height: 1;
  }
  .language-option .lang-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 600px) {
    .language-menu { width: min(350px, calc(100vw - 20px)); grid-template-columns: 1fr; max-height: 60vh; }
    .language-trigger { min-width: 130px; }
  }

  /* --- Tabs row --- */
  .tabs-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .tabs { display: flex; gap: 18px; }
  .tab-btn {
    background: none; border: none; color: var(--muted); font-size: 0.85rem;
    cursor: pointer; padding: 4px 0; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--text); border-color: var(--accent); }
  .pill-group { display: flex; background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; }
  .pill-btn {
    border: none; background: none; color: var(--muted); font-size: 0.8rem;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .pill-btn.active { background: var(--accent); color: white; }

  /* --- Layout grid --- */
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .panel h2 { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  .link-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; padding: 5px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .link-btn:hover { color: var(--text); }

  /* --- Hero + day strip --- */
  .hero-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .hero-card {
    flex: 1 1 220px; background: var(--panel-2); border-radius: 12px; padding: 16px;
    border: 1px solid var(--border);
  }
  .hero-card.severe { border-color: var(--warn); background: var(--warn-soft); }
  .hero-date { font-size: 0.8rem; color: var(--muted); }
  .hero-time { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
  .hero-main { display: flex; align-items: center; gap: 10px; }
  .hero-icon { font-size: 2.4rem; }
  .hero-temp { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .hero-cond { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .hero-details { margin-top: 10px; font-size: 0.75rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 0 2px 6px; }
  .day-card {
    flex: 0 0 84px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 8px; text-align: center;
  }
  .day-card.severe { border-color: var(--warn); background: var(--warn-soft); }
  .day-card .dow { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .day-card .icon { font-size: 1.4rem; }
  .day-card .hi { font-size: 0.9rem; font-weight: 600; margin-top: 4px; }
  .day-card .lo { font-size: 0.75rem; color: var(--muted); }

  /* --- Air quality panel --- */
  .aqi-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .aqi-badge {
    width: 84px; height: 84px; border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem;
    border: 3px solid var(--accent); flex: none;
  }
  .aqi-badge span { font-size: 0.65rem; font-weight: 400; color: var(--muted); }
  .aqi-meta { font-size: 0.8rem; color: var(--muted); line-height: 1.7; }
  .aqi-meta b { color: var(--text); }

  /* --- Global map (decorative + outbound link) --- */
  .map-area {
    position: relative; height: 220px; border-radius: 12px; overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, #1e2a44 0, transparent 40%),
      radial-gradient(circle at 70% 60%, #1e2a44 0, transparent 45%),
      var(--panel-2);
    border: 1px solid var(--border);
  }
  .map-dots {
    position: absolute; inset: 0; opacity: 0.5;
    background-image: radial-gradient(#3b4863 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .map-card {
    position: absolute; left: 16px; bottom: 16px; max-width: 220px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 0.75rem; color: var(--muted);
  }
  .map-card a.link-btn { display: inline-block; margin-top: 8px; color: var(--text); }

  /* --- Chance of rain chart --- */
  .rain-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 6px; }
  .rain-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .rain-bar { width: 60%; background: var(--accent); border-radius: 4px 4px 0 0; margin-top: auto; min-height: 3px; }
  .rain-label { font-size: 0.65rem; color: var(--muted); margin-top: 6px; }

  /* --- Other cities --- */
  .city-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
  }
  .city-row:last-child { border-bottom: none; }
  .city-row .name { display: flex; align-items: center; gap: 8px; }
  .city-row .cond { color: var(--muted); font-size: 0.75rem; }
  .city-row.severe .name { color: var(--warn); }

  /* --- Chat drawer --- */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 40;
  }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(380px, 92vw);
    background: var(--panel); border-left: 1px solid var(--border); z-index: 50;
    transform: translateX(100%); transition: transform 0.2s ease;
    display: flex; flex-direction: column; padding: 16px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .drawer-head h2 { margin: 0; font-size: 1rem; }
  #ws-status { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
  #log {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    padding: 10px 8px 10px 10px; background: var(--panel-2); border-radius: 10px; margin-bottom: 10px;
  }
  .msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; font-size: 0.85rem; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.bot { align-self: flex-start; background: var(--panel); }
  .msg.typing { align-self: flex-start; color: var(--muted); font-style: italic; }
  .msg.alert { align-self: center; background: var(--warn-soft); color: #fed7aa; border: 1px solid var(--warn); font-size: 0.8rem; max-width: 100%; }
  #form { display: flex; gap: 6px; }
  #input {
    flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 0.85rem;
  }
  #send { padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent); color: white; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .examples { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  .examples button { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-size: 0.7rem; padding: 4px 8px; margin: 2px 4px 0 0; border-radius: 6px; cursor: pointer; }

  /* --- Alert toast --- */
  #toast-stack { position: fixed; top: 16px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  .toast {
    background: var(--warn-soft); border: 1px solid var(--warn); color: #fed7aa;
    padding: 10px 14px; border-radius: 10px; font-size: 0.8rem;
  }

  .muted-note { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <button class="icon-btn" id="chat-toggle" title="Ask WeatherGPT">💬</button>
    <div class="place">📍 <strong id="place-name" data-i18n="Detecting location…">Detecting location…</strong></div>
    <div class="search-wrap">
      <form id="search-form">
        <input id="search-input" type="text" placeholder="Search city…" autocomplete="off" />
      </form>
    </div>
    <div class="topbar-right">
      <div class="language-picker" id="language-picker">
        <select id="language-select" aria-label="Language" title="Language">
          <option value="auto">Auto detect</option>
        </select>
        <button class="language-trigger" id="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" title="Language">
          <span class="lang-trigger-left"><span class="language-globe" aria-hidden="true">🌐</span><span id="language-current">English</span></span>
          <span class="language-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="language-menu" id="language-menu" role="listbox" aria-label="Choose language"></div>
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </div>

  <!-- Tabs row -->
  <div class="tabs-row">
    <div class="tabs">
      <button class="tab-btn active" data-tab="today" data-i18n="Today">Today</button>
      <button class="tab-btn" data-tab="tomorrow" data-i18n="Tomorrow">Tomorrow</button>
      <button class="tab-btn" data-tab="week" data-i18n="Next 7 days">Next 7 days</button>
    </div>
    <div class="pill-group">
      <button class="pill-btn active" data-pill="forecast" data-i18n="Forecast">Forecast</button>
      <button class="pill-btn" data-pill="air" data-i18n="Air quality">Air quality</button>
    </div>
  </div>

  <div class="grid">
    <!-- Main column -->
    <div>
      <div class="panel" id="forecast-panel">
        <div class="hero-row" id="hero-row"><div class="muted-note" data-i18n="Loading forecast…">Loading forecast…</div></div>
        <div class="strip" id="day-strip"></div>
      </div>

      <div class="panel" id="air-panel" style="display:none; margin-top:18px;">
        <h2 data-i18n="Air quality">Air quality</h2>
        <div class="aqi-wrap" id="aqi-wrap"><div class="muted-note" data-i18n="Loading…">Loading…</div></div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <div class="panel-head">
          <h2 data-i18n="Global map">Global map</h2>
          <a class="link-btn" data-i18n="View wide" href="https://www.windy.com" target="_blank" rel="noopener">View wide</a>
        </div>
        <div class="map-area">
          <div class="map-dots"></div>
          <div class="map-card">
            <span data-i18n="Explore a global map of wind, weather and ocean conditions.">Explore a global map of wind, weather and ocean conditions.</span>
            <br />
            <a class="link-btn" data-i18n="Explore map →" href="https://www.windy.com" target="_blank" rel="noopener">Explore map →</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar column -->
    <div>
      <div class="panel">
        <h2 data-i18n="Chance of rain">Chance of rain</h2>
        <div class="rain-chart" id="rain-chart"><div class="muted-note" data-i18n="Loading…">Loading…</div></div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <h2 data-i18n="Other cities">Other cities</h2>
        <div id="other-cities"><div class="muted-note" data-i18n="Loading…">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Alert toasts -->
<div id="toast-stack"></div>

<!-- Chat drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 data-i18n="🌦️ Ask WeatherGPT">🌦️ Ask WeatherGPT</h2>
    <button class="icon-btn" id="drawer-close">✕</button>
  </div>
  <div id="ws-status" data-i18n="connecting…">connecting…</div>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask about weather anywhere…" autocomplete="off" />
    <button id="send" type="submit" data-i18n="Send">Send</button>
  </form>
  <div class="examples">
    <button type="button" data-q="will it rain in Pune tomorrow?">rain in Pune tomorrow?</button>
    <button type="button" data-q="any cyclone alert for Chennai">cyclone alert Chennai</button>
    <button type="button" data-q="crop advisory for Nashik">crop advisory Nashik</button>
  </div>
</div>

<script>
// =====================================================================
// Dynamic Indian-language support
// =====================================================================
// English is the default; users can switch to Auto detect or any supported language.
let selectedLanguage = localStorage.getItem('weathergpt-language') || 'en';
let effectiveLanguage = selectedLanguage === 'auto' ? 'en' : selectedLanguage;
const languageSelect = document.getElementById('language-select');
const languagePicker = document.getElementById('language-picker');
const languageTrigger = document.getElementById('language-trigger');
const languageCurrent = document.getElementById('language-current');
const languageMenu = document.getElementById('language-menu');

const languageIcons = {
  auto:'✨', en:'🇺🇸', hi:'🇮🇳', mr:'🇮🇳', bn:'🇮🇳', te:'🇮🇳', ta:'🇮🇳',
  gu:'🇮🇳', kn:'🇮🇳', ml:'🇮🇳', pa:'🇮🇳', or:'🇮🇳', as:'🇮🇳', ur:'🇮🇳', ne:'🇳🇵',
  kok:'🇮🇳', mai:'🇮🇳', sa:'🇮🇳', mni:'🇮🇳', doi:'🇮🇳', ks:'🇮🇳', sd:'🇮🇳', sat:'🇮🇳', brx:'🇮🇳'
};

function renderLanguageMenu() {
  languageMenu.innerHTML = '';
  [...languageSelect.options].forEach(option => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'language-option' + (option.value === languageSelect.value ? ' active' : '');
    button.dataset.value = option.value;
    button.setAttribute('role', 'option');
    button.setAttribute('aria-selected', option.value === languageSelect.value ? 'true' : 'false');
    button.innerHTML = `<span class="lang-icon" aria-hidden="true">${languageIcons[option.value] || '🌐'}</span><span class="lang-name"></span>`;
    button.querySelector('.lang-name').textContent = option.textContent;
    // Prefetch on hover/focus: fires the same translate request the click
    // will need, so by the time the user actually clicks, the server-side
    // cache in language_service.py is already warm and the click resolves
    // near-instantly instead of waiting on a fresh LLM round trip.
    const prefetch = () => {
      if (option.value === 'auto' || option.value === selectedLanguage) return;
      const elements = [...document.querySelectorAll('[data-i18n]')];
      const source = [...elements.map(el => el.dataset.i18n),
        'Search city…', 'Ask about weather anywhere…', 'Language', 'Ask WeatherGPT'];
      translateTexts(source, option.value === 'auto' ? 'en' : option.value);
    };
    button.addEventListener('mouseenter', prefetch, { once: true });
    button.addEventListener('focus', prefetch, { once: true });
    button.addEventListener('click', async () => {
      languageSelect.value = option.value;
      languagePicker.classList.remove('open');
      languageTrigger.setAttribute('aria-expanded', 'false');
      await applyLanguage(option.value);
      renderLanguageMenu();
    });
    languageMenu.appendChild(button);
  });
  const selected = languageSelect.options[languageSelect.selectedIndex];
  if (selected) {
    languageCurrent.textContent = selected.textContent;
    languageTrigger.title = selected.textContent;
  }
}

languageTrigger.addEventListener('click', () => {
  const open = languagePicker.classList.toggle('open');
  languageTrigger.setAttribute('aria-expanded', String(open));
  if (open) {
    const active = languageMenu.querySelector('.language-option.active');
    active?.scrollIntoView({block:'nearest'});
  }
});

document.addEventListener('click', (event) => {
  if (!languagePicker.contains(event.target)) {
    languagePicker.classList.remove('open');
    languageTrigger.setAttribute('aria-expanded', 'false');
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    languagePicker.classList.remove('open');
    languageTrigger.setAttribute('aria-expanded', 'false');
  }
});

async function loadLanguages() {
  try {
    const res = await fetch('/i18n/languages');
    const data = await res.json();
    for (const lang of (data.languages || [])) {
      const option = document.createElement('option');
      option.value = lang.code;
      option.textContent = lang.name;
      languageSelect.appendChild(option);
    }
    languageSelect.value = selectedLanguage;
    renderLanguageMenu();
    await applyLanguage(selectedLanguage, {reloadDashboard: false});
    renderLanguageMenu();
  } catch (_) {}
}

async function translateTexts(texts, language = effectiveLanguage) {
  if (!texts.length || language === 'en') return texts;
  try {
    const res = await fetch('/i18n/translate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({texts, language})
    });
    if (!res.ok) return texts;
    return (await res.json()).translations || texts;
  } catch (_) { return texts; }
}

async function localizeElements(root = document) {
  const elements = [...root.querySelectorAll('[data-i18n]')];
  if (!elements.length) return;
  const source = elements.map(el => el.dataset.i18n);
  const translated = await translateTexts(source);
  elements.forEach((el, i) => { el.textContent = translated[i] ?? source[i]; });
}

function i18nText(source) {
  const span = document.createElement('span');
  span.dataset.i18n = source;
  span.textContent = source;
  return span.outerHTML;
}

let languageSwitchToken = 0;

async function applyLanguage(language, {reloadDashboard = true} = {}) {
  const myToken = ++languageSwitchToken;
  selectedLanguage = language || 'auto';
  localStorage.setItem('weathergpt-language', selectedLanguage);
  // Explicit language selection wins. Auto detect starts from English until a
  // message is analyzed, preventing stale language state when switching back.
  effectiveLanguage = selectedLanguage === 'auto' ? 'en' : selectedLanguage;

  languagePicker.classList.add('loading');
  languageTrigger.setAttribute('aria-busy', 'true');

  if (reloadDashboard && currentDashboard) {
    renderForecast(); renderAirQuality(); renderRainChart();
  }

  // Batch every visible data-i18n string plus the handful of dynamic
  // placeholder/title strings into ONE translate request instead of two
  // sequential ones (the previous version also called localizeElements()
  // twice back-to-back here, doubling latency for no benefit) — this
  // halves the round trips on every language switch.
  const extraKeys = ['Search city…', 'Ask about weather anywhere…', 'Language', 'Ask WeatherGPT'];
  const elements = [...document.querySelectorAll('[data-i18n]')];
  const source = [...elements.map(el => el.dataset.i18n), ...extraKeys];
  const translated = await translateTexts(source, effectiveLanguage);

  // A newer language switch started while this one was still in flight
  // (e.g. the user clicked a second option before the first request
  // returned) — drop this stale result instead of letting it clobber the
  // newer selection. The newer call owns clearing the loading state.
  if (myToken !== languageSwitchToken) return;

  elements.forEach((el, i) => { el.textContent = translated[i] ?? source[i]; });
  const [searchPlaceholder, chatPlaceholder, languageTitle, askTitle] = translated.slice(elements.length);

  document.getElementById('search-input').placeholder = searchPlaceholder;
  document.getElementById('input').placeholder = chatPlaceholder;
  languageSelect.title = languageTitle;
  document.getElementById('chat-toggle').title = askTitle;
  document.documentElement.lang = effectiveLanguage;

  if (reloadDashboard && currentDashboard) {
    loadOtherCities(currentDashboard.resolved_name.split(',')[0]);
  }

  const selected = [...languageSelect.options].find(o => o.value === selectedLanguage);
  if (selected) {
    languageCurrent.textContent = selected.textContent;
  }
  languageTrigger.title = languageTitle;
  languagePicker.classList.remove('open', 'loading');
  languageTrigger.removeAttribute('aria-busy');
  languageTrigger.setAttribute('aria-expanded', 'false');
  languageMenu.querySelectorAll('.language-option').forEach(btn => {
    const active = btn.dataset.value === selectedLanguage;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  });
}

languageSelect.addEventListener('change', async () => {
  await applyLanguage(languageSelect.value);
  renderLanguageMenu();
});

async function detectFromMessage(text) {
  if (selectedLanguage !== 'auto') return effectiveLanguage;
  try {
    const res = await fetch('/i18n/detect', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})
    });
    if (res.ok) {
      const data = await res.json();
      effectiveLanguage = data.language || 'en';
      document.documentElement.lang = effectiveLanguage;
      if (effectiveLanguage !== 'en') {
        await applyLanguage(effectiveLanguage);
      }
    }
  } catch (_) {}
  return effectiveLanguage;
}

loadLanguages();

// =====================================================================
// State
// =====================================================================
let currentDashboard = null; // last successful /dashboard/weather response
let currentLocationQuery = null; // preserve the user's GPS coordinates for refreshes
let activeTab = 'today';     // today | tomorrow | week
let activePill = 'forecast'; // forecast | air

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// =====================================================================
// Dashboard loading
// =====================================================================
const placeNameEl = document.getElementById('place-name');
const heroRow = document.getElementById('hero-row');
const dayStrip = document.getElementById('day-strip');
const aqiWrap = document.getElementById('aqi-wrap');
const rainChart = document.getElementById('rain-chart');
const otherCitiesEl = document.getElementById('other-cities');

async function loadDashboard(query) {
  // Keep the exact location source (GPS or searched city) so periodic refreshes
  // never silently replace GPS weather with a city-centre lookup.
  currentLocationQuery = { ...query };
  const params = new URLSearchParams(query);
  const requestedLocation = query.city ? String(query.city).trim() : '';

  // Never leave the header stuck on "Loading…". Show the requested city
  // immediately while the weather API is resolving it, or show a useful
  // location status while browser coordinates are being resolved.
  if (requestedLocation) {
    // Show the user's search immediately; replace it with the API-resolved
    // city/state as soon as the request completes.
    placeNameEl.textContent = requestedLocation;
  } else if (query.lat != null && query.lon != null) {
    // Do not expose an artificial/hardcoded location name. The backend
    // reverse-geocodes the actual browser coordinates and fills this in.
    placeNameEl.textContent = '';
    placeNameEl.removeAttribute('data-i18n');
  }

  try {
    const res = await fetch(`/dashboard/weather?${params.toString()}`);
    let errorDetail = '';
    if (!res.ok) {
      try {
        const err = await res.json();
        errorDetail = err.detail || '';
      } catch (_) {}
      throw new Error(errorDetail || 'Weather request failed');
    }

    const data = await res.json();
    currentDashboard = data;

    // resolved_name comes from reverse geocoding for GPS coordinates or
    // forward geocoding for a search; nothing is hardcoded here.
    const [translatedPlace] = await translateTexts([data.resolved_name], effectiveLanguage);
    placeNameEl.textContent = translatedPlace || data.resolved_name || requestedLocation;

    renderForecast();
    renderAirQuality();
    renderRainChart();
    await localizeElements();
    await loadOtherCities(data.resolved_name.split(',')[0]);
  } catch (e) {
    // Keep the user's searched location visible instead of replacing it with
    // an endless loading state. For geolocation failures, show a clear status.
    const fallback = requestedLocation || 'Location unavailable';
    const [translatedFallback] = await translateTexts([fallback], effectiveLanguage);
    placeNameEl.textContent = translatedFallback;

    const message = e?.message && e.message !== 'Weather request failed'
      ? e.message
      : 'Could not load weather for this location.';
    heroRow.innerHTML = `<div class="muted-note" data-i18n="${message.replace(/"/g, '&quot;')}">${message}</div>`;
    await localizeElements(heroRow);
    dayStrip.innerHTML = '';
    aqiWrap.innerHTML = '';
    rainChart.innerHTML = '';
  }
}
function dowLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(effectiveLanguage === 'en' ? undefined : effectiveLanguage, { weekday: 'short' });
}

function renderForecast() {
  if (!currentDashboard) return;
  const { current, days, severe } = currentDashboard;
  heroRow.innerHTML = '';
  dayStrip.innerHTML = '';

  if (activeTab === 'week') {
    // No single hero — show all 7 days as the strip, slightly larger context.
    days.forEach(d => dayStrip.appendChild(buildDayCard(d)));
    return;
  }

  const heroIndex = activeTab === 'tomorrow' ? 1 : 0;
  const heroDay = days[heroIndex];
  const hero = document.createElement('div');
  hero.className = 'hero-card' + (activeTab === 'today' && severe ? ' severe' : '');

  if (activeTab === 'today') {
    const now = new Date();
    hero.innerHTML = `
      <div class="hero-date">${DOW[now.getDay()]}</div>
      <div class="hero-time">${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
      <div class="hero-main">
        <div class="hero-icon">${current.icon}</div>
        <div>
          <div class="hero-temp">${current.temperature ?? '—'}°</div>
          <div class="hero-cond" data-i18n="${current.condition ?? ''}">${current.condition ?? ''}</div>
        </div>
      </div>
      <div class="hero-details">
        <span data-i18n="Humidity: ${current.humidity ?? '—'}%">Humidity: ${current.humidity ?? '—'}%</span>
        <span data-i18n="Wind: ${current.wind_kmh ?? '—'} km/h">Wind: ${current.wind_kmh ?? '—'} km/h</span>
        <span data-i18n="Pressure: ${current.pressure_hpa ?? '—'} hPa">Pressure: ${current.pressure_hpa ?? '—'} hPa</span>
      </div>
    `;
  } else {
    hero.innerHTML = `
      <div class="hero-date">${dowLabel(heroDay.date)}</div>
      <div class="hero-time">${heroDay.date}</div>
      <div class="hero-main">
        <div class="hero-icon">${heroDay.icon}</div>
        <div>
          <div class="hero-temp">${heroDay.temp_max}°</div>
          <div class="hero-cond" data-i18n="${heroDay.condition}">${heroDay.condition}</div>
        </div>
      </div>
      <div class="hero-details">
        <span data-i18n="Low: ${heroDay.temp_min}°">Low: ${heroDay.temp_min}°</span>
        <span data-i18n="Rain chance: ${heroDay.rain_chance_pct ?? '—'}%">Rain chance: ${heroDay.rain_chance_pct ?? '—'}%</span>
        <span data-i18n="${heroDay.precipitation_mm} mm">${heroDay.precipitation_mm} mm</span>
      </div>
    `;
  }
  heroRow.appendChild(hero);

  const stripDays = activeTab === 'today' ? days.slice(1) : days.slice(2);
  stripDays.forEach(d => dayStrip.appendChild(buildDayCard(d)));
}

function buildDayCard(d) {
  const card = document.createElement('div');
  card.className = 'day-card' + (d.rain_chance_pct >= 70 || d.precipitation_mm > 50 ? ' severe' : '');
  card.innerHTML = `
    <div class="dow">${dowLabel(d.date)}</div>
    <div class="icon">${d.icon}</div>
    <div class="hi">${d.temp_max}°</div>
    <div class="lo">${d.temp_min}°</div>
  `;
  return card;
}

function aqiCategory(aqi) {
  if (aqi <= 50) return { label: 'Good', color: '#22c55e' };
  if (aqi <= 100) return { label: 'Moderate', color: '#eab308' };
  if (aqi <= 150) return { label: 'Unhealthy (SG)', color: '#f97316' };
  if (aqi <= 200) return { label: 'Unhealthy', color: '#ef4444' };
  if (aqi <= 300) return { label: 'Very Unhealthy', color: '#a855f7' };
  return { label: 'Hazardous', color: '#7f1d1d' };
}

function renderAirQuality() {
  if (!currentDashboard) return;
  const aqi = currentDashboard.aqi;
  if (!aqi || aqi.us_aqi == null) {
    aqiWrap.innerHTML = '<div class="muted-note" data-i18n="Air quality data is unavailable for this location right now.">Air quality data is unavailable for this location right now.</div>';
    return;
  }
  const cat = aqiCategory(aqi.us_aqi);
  aqiWrap.innerHTML = `
    <div class="aqi-badge" style="border-color:${cat.color}">
      ${aqi.us_aqi}<span data-i18n="US AQI">US AQI</span>
    </div>
    <div class="aqi-meta">
      <div><b data-i18n="${cat.label}">${cat.label}</b></div>
      <div data-i18n="PM2.5: ${aqi.pm2_5 ?? '—'} µg/m³">PM2.5: ${aqi.pm2_5 ?? '—'} µg/m³</div>
      <div data-i18n="PM10: ${aqi.pm10 ?? '—'} µg/m³">PM10: ${aqi.pm10 ?? '—'} µg/m³</div>
    </div>
  `;
}

function renderRainChart() {
  if (!currentDashboard) return;
  const days = currentDashboard.days.slice(0, 7);
  rainChart.innerHTML = '';
  days.forEach(d => {
    const pct = d.rain_chance_pct ?? Math.min(100, (d.precipitation_mm || 0) * 4);
    const wrap = document.createElement('div');
    wrap.className = 'rain-bar-wrap';
    wrap.innerHTML = `
      <div class="rain-bar" style="height:${Math.max(pct, 3)}%"></div>
      <div class="rain-label">${dowLabel(d.date)}</div>
    `;
    rainChart.appendChild(wrap);
  });
}

async function loadOtherCities(exclude) {
  try {
    const res = await fetch(`/dashboard/other-cities?exclude=${encodeURIComponent(exclude || '')}`);
    const data = await res.json();
    if (!data.cities || data.cities.length === 0) {
      otherCitiesEl.innerHTML = '<div class="muted-note" data-i18n="No data yet.">No data yet.</div>';
      await localizeElements(otherCitiesEl);
      return;
    }
    otherCitiesEl.innerHTML = '';
    data.cities.forEach(c => {
      const row = document.createElement('div');
      row.className = 'city-row' + (c.severe ? ' severe' : '');
      row.innerHTML = `
        <div class="name">${c.severe ? '⚠️ ' : ''}${c.name}</div>
        <div>
          <span>${c.temperature ?? '—'}°</span>
          <div class="cond" data-i18n="${c.condition ?? ''}">${c.condition ?? ''}</div>
        </div>
      `;
      otherCitiesEl.appendChild(row);
    });
    await localizeElements(otherCitiesEl);
  } catch (e) {
    otherCitiesEl.innerHTML = '<div class="muted-note" data-i18n="Could not load.">Could not load.</div>';
    await localizeElements(otherCitiesEl);
  }
}

// --- Tabs / pills ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

document.querySelectorAll('.pill-btn').forEach(btn => {

// --- Search ---
document.getElementById('search-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = document.getElementById('search-input').value.trim();
  if (!val) return;
  await detectFromMessage(val);

// --- Theme toggle (light/dark) ---
const themeBtn = document.getElementById('theme-toggle');
let isLight = false;
themeBtn.addEventListener('click', () => {
  isLight = !isLight;
  document.documentElement.style.setProperty('--bg', isLight ? '#f4f6fb' : '#0b0e14');
  document.documentElement.style.setProperty('--panel', isLight ? '#ffffff' : '#151a24');

  document.documentElement.style.setProperty('--border', isLight ? '#dde3f0' : '#262d3d');

  document.documentElement.style.setProperty('--scroll-thumb-hover', isLight ? '#4f8cff' : '#6fa3ff');
  themeBtn.textContent = isLight ? '☀️' : '🌙';
});

// --- Initial load: use the browser's actual location ---
function initDashboard() {
  if (!('geolocation' in navigator)) {
    placeNameEl.textContent = 'Location unavailable';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      loadDashboard({ lat: pos.coords.latitude, lon: pos.coords.longitude });
    },
    () => {
      // Never substitute a hardcoded city for the user's current location.
      // A fallback city can be misleading, especially when the user is travelling.
      placeNameEl.textContent = 'Location unavailable';
      placeNameEl.removeAttribute('data-i18n');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5 * 60 * 1000 }
  );
}
initDashboard();
setTimeout(() => localizeElements(), 200);
setInterval(() => {
  // Refresh using the same GPS coordinates instead of converting the current
  // location into a city search (which can move the weather point).
  if (currentLocationQuery) loadDashboard(currentLocationQuery);
}, 10 * 60 * 1000);

// Chat drawer (WebSocket) — same functionality as before, tucked away
// =====================================================================
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawer-overlay');
document.getElementById('chat-toggle').addEventListener('click', () => {
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
});
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
}

const log = document.getElementById('log');
const wsStatus = document.getElementById('ws-status');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function showToast(message) {
  const stack = document.getElementById('toast-stack');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 12000);
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const wsUrl = `${proto}://${location.host}/ws/chat`;
let ws = null;
let typingEl = null;
let reconnectTimer = null;
let reconnectDelay = 1000;
let manuallyClosed = false;

function setChatStatus(text, connected = false) {
  wsStatus.textContent = text;
  wsStatus.classList.toggle('connected', connected);
}

async function connectChat() {
  if (manuallyClosed || (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING))) return;

  clearTimeout(reconnectTimer);
  setChatStatus((await translateTexts(['connecting…']))[0], false);

  try {
    ws = new WebSocket(wsUrl);
  } catch (err) {
    scheduleReconnect();
    return;
  }

  ws.onopen = async () => {
    reconnectDelay = 1000;
    sendBtn.disabled = false;
    setChatStatus((await translateTexts(['connected']))[0], true);
  };

  ws.onclose = async () => {
    if (typingEl) { typingEl.remove(); typingEl = null; }
    sendBtn.disabled = true;
    setChatStatus((await translateTexts(['disconnected — reconnecting…']))[0], false);
    scheduleReconnect();
  };

  ws.onerror = async () => {
    setChatStatus((await translateTexts(['connection error — retrying…']))[0], false);
    // onclose will perform the actual reconnect.
  };

  ws.onmessage = async (event) => {
    let msg;
    try { msg = JSON.parse(event.data); }
    catch { return; }

    if (msg.type === 'ready') {
      const label = msg.mode === 'ai' ? 'connected • AI + live weather' : 'connected • live weather';
      setChatStatus(label, true);
      return;
    }
    if (msg.type === 'status' && msg.status === 'thinking') {
      if (typingEl) typingEl.remove();
      typingEl = addMsg((await translateTexts(['WeatherGPT is thinking…']))[0], 'typing');
      return;
    }
    if (msg.type === 'reply') {
      if (typingEl) { typingEl.remove(); typingEl = null; }
      addMsg(msg.reply, 'bot');
      setChatStatus(msg.mode === 'ai' ? 'connected • AI + live weather' : 'connected • live weather', true);
      sendBtn.disabled = false;
      return;
    }
    if (msg.type === 'error') {
      if (typingEl) { typingEl.remove(); typingEl = null; }
      addMsg('⚠️ ' + msg.message, 'bot');
      sendBtn.disabled = false;
      setChatStatus('connected • live weather', true);
      return;
    }
    if (msg.type === 'alert') {
      addMsg(msg.message, 'alert');
      showToast(msg.message);
    }
  };
}

function scheduleReconnect() {
  if (manuallyClosed || reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectChat();
  }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 10000);
}

connectChat();

async function send(text) {
  if (!text.trim()) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addMsg((await translateTexts(['Chat is reconnecting. Please try again in a moment.']))[0], 'bot');
    connectChat();
    return;
  }
  addMsg(text, 'user');
  sendBtn.disabled = true;
  try {
    const lang = await detectFromMessage(text);
    ws.send(JSON.stringify({ message: text, language: lang }));
    input.value = '';
  } catch (err) {
    sendBtn.disabled = false;
    addMsg('⚠️ Unable to send the message. Please try again.', 'bot');
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  send(input.value);
});

document.querySelectorAll('.examples button').forEach(btn => {
  btn.addEventListener('click', () => {
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
    send(btn.dataset.q);
  });
});
